services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studysync-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require&channelBinding=require
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: "false"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_VALIDITY_SECONDS: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:-3600}
      JWT_REFRESH_TOKEN_VALIDITY_SECONDS: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:-604800}

      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 20MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 25MB
      STUDYSYNC_UPLOAD_DIR: /app/uploads/documents
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_KEY_PREFIX: ${AWS_S3_KEY_PREFIX:-documents}
      AWS_S3_PRESIGNED_URL_MINUTES: ${AWS_S3_PRESIGNED_URL_MINUTES:-15}
      STUDYSYNC_ALLOWED_ORIGIN: ${STUDYSYNC_ALLOWED_ORIGIN:-http://localhost:5173}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}

      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    volumes:
      - uploads-data:/app/uploads/documents
    networks:
      - app-network

volumes:
  uploads-data:
    driver: local

networks:
  app-network:
    driver: bridge
