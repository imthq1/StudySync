name: Deploy backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "StudySync/**"
      - ".github/workflows/deploy-backend-ec2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StudySync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.CI_SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.CI_SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
        run: sh ./mvnw --batch-mode clean verify

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
      EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
      EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH || '/home/ubuntu/studysync/backend' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_SSH_PRIVATE_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directory
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes \
            -p "$EC2_SSH_PORT" "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$EC2_DEPLOY_PATH'"

      - name: Upload backend source
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'target/' \
            --exclude 'uploads/' \
            -e "ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -p $EC2_SSH_PORT" \
            StudySync/ "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/"

      - name: Build and restart backend
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes \
            -p "$EC2_SSH_PORT" "$EC2_USER@$EC2_HOST" \
            bash -s -- "$EC2_DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          cd "$1"

          if [ ! -s .env ]; then
            echo "Missing or empty $1/.env. Create it on EC2 before deploying." >&2
            exit 1
          fi

          for required_var in DB_HOST DB_NAME DB_USER DB_PASSWORD JWT_SECRET AWS_REGION AWS_S3_BUCKET; do
            if ! grep -qE "^${required_var}=" .env; then
              echo "Missing ${required_var} in $1/.env" >&2
              exit 1
            fi
          done

          if docker compose version >/dev/null 2>&1; then
            compose() { docker compose --env-file .env "$@"; }
          elif command -v docker-compose >/dev/null 2>&1; then
            compose() { docker-compose --env-file .env "$@"; }
          else
            echo "Docker Compose is not installed on EC2. Install the Docker Compose plugin and rerun this workflow." >&2
            exit 1
          fi

          compose config > /dev/null
          compose build --pull
          compose up -d --remove-orphans

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then
              compose ps
              exit 0
            fi
            sleep 5
          done
  
          compose ps
          compose logs --tail=200 backend
          exit 1
          REMOTE
