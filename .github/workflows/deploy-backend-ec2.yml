name: Deploy backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "StudySync/**"
      - ".github/workflows/deploy-backend-ec2.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StudySync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.CI_SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.CI_SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
        run: sh ./mvnw --batch-mode clean verify

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
      EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
      EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH || '/home/ubuntu/studysync/backend' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '158016107704' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::158016107704:role/GitHubActionsECRPush' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'studysync-backend' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --pull -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" StudySync
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_SSH_PRIVATE_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload Docker Compose file
        run: |
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes \
            -p "$EC2_SSH_PORT" "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$EC2_DEPLOY_PATH'"
          scp -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes \
            -P "$EC2_SSH_PORT" StudySync/docker-compose.yml \
            "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/docker-compose.yml"

      - name: Build and restart backend
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes \
            -p "$EC2_SSH_PORT" "$EC2_USER@$EC2_HOST" \
            bash -s -- "$EC2_DEPLOY_PATH" \
              "$AWS_REGION" "$AWS_ACCOUNT_ID" "$ECR_REPOSITORY" "${{ github.sha }}" <<'REMOTE'
          set -Eeuo pipefail
          cd "$1"
          AWS_REGION="$2"
          AWS_ACCOUNT_ID="$3"
          ECR_REPOSITORY="$4"
          IMAGE_TAG="$5"
          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          export ECR_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          if ! command -v aws >/dev/null 2>&1; then
            echo "AWS CLI is not installed on EC2." >&2
            exit 1
          fi
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          if [ ! -s .env ]; then
            echo "Missing or empty $1/.env. Create it on EC2 before deploying." >&2
            exit 1
          fi

          for required_var in DB_HOST DB_NAME DB_USER DB_PASSWORD JWT_SECRET AWS_REGION AWS_S3_BUCKET; do
            if ! grep -qE "^${required_var}=" .env; then
              echo "Missing ${required_var} in $1/.env" >&2
              exit 1
            fi
          done

          if docker compose version >/dev/null 2>&1; then
            compose() { docker compose --env-file .env "$@"; }
          elif command -v docker-compose >/dev/null 2>&1; then
            compose() { docker-compose --env-file .env "$@"; }
          else
            echo "Docker Compose is not installed on EC2. Install the Docker Compose plugin and rerun this workflow." >&2
            exit 1
          fi

          # Fail fast if the uploaded Compose file does not reference the image
          # that this workflow just pushed. This prevents falling back to a local
          # build such as backend-backend.
          compose config > /dev/null
          compose config --images | grep -Fx "$ECR_IMAGE"

          # Pull the exact immutable SHA tag and never build from EC2 source.
          docker pull "$ECR_IMAGE"

          # Remove any leftover container with the fixed name before recreating it.
          # This also handles containers created by an older Compose project name.
          docker rm -f studysync-backend >/dev/null 2>&1 || true

          compose up -d --no-build --force-recreate --remove-orphans
          test "$(docker inspect --format '{{.Config.Image}}' studysync-backend)" = "$ECR_IMAGE"
          docker image prune -f

          compose ps
          REMOTE
